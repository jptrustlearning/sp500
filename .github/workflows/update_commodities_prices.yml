name: Daily Commodities + Macro ETFs Update (WTI/GOLD/FXY/USL/USO/GLD/SGOV/BIL)

# Auto-detects PER TICKER: if input_commodities_daily.csv missing the ticker
# → initial backfill from 2001 (or ticker inception, whichever is later);
# else → incremental update from that ticker's last date + 1.
# Adding new tickers later automatically backfills them while existing ones
# do incremental.
#
# Tickers tracked:
#   CL=F → WTI   (crude oil futures, since 2001)
#   GC=F → GOLD  (gold futures, since 2001)
#   FXY  → FXY   (CurrencyShares Japanese Yen Trust ETF, since 2007)
#   USL  → USL   (12-Month WTI Oil ETF, since 2007)
#   USO  → USO   (front-month WTI Oil ETF, since 2006)
#   GLD  → GLD   (SPDR Gold Shares ETF, since 2004)
#   SGOV → SGOV  (iShares 0-3 Month T-Bond, since May 2020) — cash-equivalent
#   BIL  → BIL   (SPDR 1-3 Month T-Bill, since 2007) — pre-2020 cash fallback
#
# First run with all 4 = ~6,500×2 + ~4,800×2 = ~22,500 rows / ~1.1 MB.

on:
  schedule:
    # ทุกวันอังคาร-เสาร์ เวลา 00:25 UTC = 07:25 เวลาไทย
    # (หลัง JPY update 5 นาที เพื่อไม่ให้ชนกัน)
    - cron: '25 0 * * 2-6'
  workflow_dispatch:

jobs:
  update-commodities:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SP500_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run commodities price updater
        run: python scripts/update_commodities_daily.py

      - name: Commit and push
        run: |
          git config user.email "jptrustlearning@users.noreply.github.com"
          git config user.name "JP Trust Learning"
          git add input_commodities_daily.csv logs/
          git diff --cached --quiet || (
            TIMESTAMP=$(date -u +"%Y-%m-%d")
            git commit -m "🛢️🥇💴💵 Commodities+ETFs (WTI/GOLD/FXY/USL/USO/GLD/SGOV/BIL) daily — ${TIMESTAMP}"
            git pull --rebase origin main
            git push
          )
