name: Daily Benchmark Update

on:
  schedule:
    # ทุกวันอังคาร-เสาร์ เวลา 00:15 UTC = 07:15 เวลาไทย
    # (หลัง SP500 update 15 นาที เพื่อไม่ให้ชนกัน)
    - cron: '15 0 * * 2-6'
  workflow_dispatch:
    # กด Run workflow ด้วยมือได้จาก Actions tab

jobs:
  update-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SP500_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run benchmark price updater
        run: python scripts/update_benchmark_daily.py

      - name: Commit and push
        run: |
          git config user.email "jptrustlearning@users.noreply.github.com"
          git config user.name "JP Trust Learning"
          git add input_benchmark_daily.csv logs/
          # Only commit if there are changes
          git diff --cached --quiet || (
            TIMESTAMP=$(date -u +"%Y-%m-%d")
            git commit -m "📊 Benchmark (SPY/QQQ/DIA) daily update — ${TIMESTAMP}"
            git push
          )
