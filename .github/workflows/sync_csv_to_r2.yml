name: Sync CSVs to Cloudflare R2

# Uploads market-data CSVs to Cloudflare R2 so the frontend fetches them from
# our own CDN (data.jptrustlearning.com) instead of raw.githubusercontent.com,
# which rate-limits per-IP (429) and was blocking real users on the Lab pages.
#
# Requires repo secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Bucket name assumed: jpt-market-data (change BUCKET below if you named it differently)
#
# Auto-syncs after each daily data workflow completes. Firing on all four means
# whichever finishes LAST re-syncs everything fresh — order/delay-proof, since
# GitHub scheduled crons are unreliable on timing (they run hours late). Also
# runnable manually.

on:
  workflow_run:
    workflows:
      - "Daily S&P 500 Update"
      - "Daily Benchmark Update"
      - "Daily USDJPY Update"
      - "Daily Commodities + Macro ETFs Update (WTI/GOLD/FXY/USL/USO/GLD/SGOV/BIL/SHY)"
      - "Mini S&P 500 — Last 14 Days"
    types: [completed]
  workflow_dispatch:

jobs:
  sync-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # manual dispatch, or when the triggering data workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # avoid aws-cli v2 auto-checksum headers that R2 can reject
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: jpt-market-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload CSVs to R2
        run: |
          set -e
          FILES="input_sp500_daily.csv \
                 input_sp500_daily_since2001.csv \
                 input_sp500_daily_since1996.csv \
                 input_sp500_delisted_hist.csv \
                 input_benchmark_daily.csv \
                 input_jpy_daily.csv \
                 input_commodities_daily.csv \
                 mini_sp500_last14days.csv \
                 mini_sp500_rotation.csv \
                 master_map.csv \n                 output_combined_score_sp500.csv \
                 profiles/all_profiles.csv"
          for f in $FILES; do
            if [ ! -f "$f" ]; then echo "::warning::missing $f — skipped"; continue; fi
            echo "→ $f ($(du -h "$f" | cut -f1))"
            aws s3 cp "$f" "s3://$BUCKET/$f" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "text/csv" \
              --cache-control "public, max-age=600" \
              --only-show-errors
          done
          echo "✅ Synced all CSVs to R2 bucket: $BUCKET"
