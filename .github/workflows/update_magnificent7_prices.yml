name: Daily Magnificent 7 Update

on:
  schedule:
    # ทุกวันอังคาร-เสาร์ เวลา 00:30 UTC = 07:30 เวลาไทย
    # (หลัง Benchmark 15 นาที เพื่อไม่ให้ชนกัน)
    - cron: '30 0 * * 2-6'
  workflow_dispatch:
    # กด Run workflow ด้วยมือได้จาก Actions tab

jobs:
  update-mag7:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SP500_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run Magnificent 7 price updater
        run: python scripts/update_magnificent7_daily.py

      - name: Commit and push
        run: |
          git config user.email "jptrustlearning@users.noreply.github.com"
          git config user.name "JP Trust Learning"
          git add input_magnificent7_daily.csv logs/
          git diff --cached --quiet || (
            TIMESTAMP=$(date -u +"%Y-%m-%d")
            git commit -m "📊 Magnificent 7 daily update — ${TIMESTAMP}"
            # push แบบลองใหม่ได้ 5 รอบ — GitHub ดีเลย์ cron หลายชั่วโมงจนหลาย workflow รันชนกัน
            # ถ้าอีกตัว push ก่อน รอบนี้จะ pull --rebase แล้ว push ใหม่ (เหตุ 2 ต.ค. 2026)
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then exit 0; fi
              echo "push attempt $i failed (another workflow likely pushed first) - retrying"
              git rebase --abort 2>/dev/null || true
              sleep $(( i * 10 + RANDOM % 10 ))
            done
            echo "push failed after 5 attempts"
            exit 1
          )
