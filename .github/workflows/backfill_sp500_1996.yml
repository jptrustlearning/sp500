name: "[One-Time] Backfill SP500 from 1996 (since1996 CSV)"

# One-time historical backfill for HIST 1996 testing (dot-com peak coverage).
# Target file: input_sp500_daily_since1996.csv (holds ONLY 1996-2000).
# Disjoint from since2001 (2001-2014) and production (2015+).
# Survivorship-biased: only current S&P 500 constituents; expect a LARGE
# "empty" list (many of today's names had not IPO'd by 1996).
# Run manually via "Run workflow" — no schedule.

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SP500_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests beautifulsoup4

      - name: Run backfill (1996-01-01 -> 2000-12-31)
        run: python scripts/backfill_sp500_1996.py

      - name: Commit and push
        run: |
          git config user.email "jptrustlearning@users.noreply.github.com"
          git config user.name "JP Trust Learning"
          git add input_sp500_daily_since1996.csv logs/
          git diff --cached --quiet || (
            git commit -m "S&P500 backfill 1996-2000 -> since1996 CSV (one-time historical, survivorship-biased)"
            git push
          )
