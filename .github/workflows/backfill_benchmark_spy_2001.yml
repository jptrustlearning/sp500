name: "[One-Time] Backfill SPY benchmark from 2001"

# ⚠️ One-time historical backfill for SPY benchmark (used by hist2001 dashboard).
# Target file: input_benchmark_daily.csv (merge with existing 2015+ data — file
# stays under 1 MB total, no size concern).
# Run manually via "Run workflow" — no schedule.

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SP500_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run SPY backfill (2001-01-01 → 2014-12-31)
        run: python scripts/backfill_benchmark_spy_2001.py

      - name: Commit and push
        run: |
          git config user.email "jptrustlearning@users.noreply.github.com"
          git config user.name "JP Trust Learning"
          git add input_benchmark_daily.csv logs/
          git diff --cached --quiet || (
            git commit -m "📈 SPY benchmark backfill 2001-2014 — one-time historical (for hist2001)"
            git push
          )
