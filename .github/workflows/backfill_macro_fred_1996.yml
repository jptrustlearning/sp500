name: "[One-Time] Backfill macro WTI/GOLD/USDJPY 1995-2000 from FRED"

# NEW, additive one-time job. Extends macro-regime inputs back to 1995 (FRED spot)
# so the hist1996 lab's defensive overlay can apply from ~mid-1996.
# Does NOT modify any existing script/workflow; only appends 1995-2000 rows into
# input_commodities_daily.csv (WTI, GOLD) and input_jpy_daily.csv (USDJPY).
# Robust push (pull --rebase + retry). Run manually via "Run workflow".

on:
  workflow_dispatch:

jobs:
  fred_macro:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SP500_PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run FRED macro backfill (1995-2000)
        run: python scripts/backfill_macro_fred_1996.py

      - name: Commit and push (rebase + retry)
        run: |
          git config user.email "jptrustlearning@users.noreply.github.com"
          git config user.name "JP Trust Learning"
          git add input_commodities_daily.csv input_jpy_daily.csv logs/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "macro backfill 1995-2000 from FRED (WTI/GOLD/USDJPY) — overlay reaches 1996"
          ok=0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then echo "pushed on attempt $i"; ok=1; break; fi
            echo "push attempt $i rejected — backing off..."; sleep $(( (RANDOM % 12) + 5 ))
          done
          [ "$ok" -eq 1 ] || { echo "ERROR: push failed after retries"; exit 1; }
